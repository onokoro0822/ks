<text x="35" y="485.0" text-anchor="middle" class="axis" transform="rotate(-90 35 485.0)">Estimated arrival trips per day</text>
<text x="900.0" y="946" text-anchor="middle" class="subtitle">Method: facility-specific person-trip-end rates; arrivals ≈ person-trip ends ÷ 2. Results are not unique visitor counts.</text>
