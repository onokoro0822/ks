<text x="136" y="166.0" text-anchor="end" class="axis">26,000</text>
<rect x="207.5" y="381.8" width="150.0" height="428.2" fill="#0f766e"/>
<rect x="207.5" y="324.7" width="150.0" height="57.1" fill="#2563eb"/>
<rect x="207.5" y="315.9" width="150.0" height="8.8" fill="#d97706"/>
