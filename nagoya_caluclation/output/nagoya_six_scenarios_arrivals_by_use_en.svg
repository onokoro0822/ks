<text x="1269" y="129" class="legend">Commercial</text>
<rect x="1420" y="112" width="20" height="20" rx="2" fill="#2563eb"/>
<text x="1449" y="129" class="legend">Office</text>
<rect x="1600" y="112" width="20" height="20" rx="2" fill="#d97706"/>
<text x="1629" y="129" class="legend">Hotel</text>
