<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800">
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#172033}
.title{font-size:34px;font-weight:700}.subtitle{font-size:18px;fill:#526078}
.axis{font-size:17px;fill:#526078}.label{font-size:20px;font-weight:700}
.value{font-size:19px;font-weight:700}
</style>
<rect width="1400" height="800" fill="#ffffff"/>
<text x="50" y="52" class="title">Estimated daily arrivals by use — 1. Commercial-centered</text>
<text x="50" y="88" class="subtitle">Program: commercial 60%, office 30%, hotel 10% of the 54,374 m² comparison area.</text>
<text x="50" y="125" class="subtitle">Total estimated arrivals: 19,765 trips/day</text>
<text x="50" y="160" class="subtitle">Reference facility: JR Gate Tower</text>
<line x1="260.0" y1="230" x2="260.0" y2="640" stroke="#e2e8f0"/>
<text x="260.0" y="675" text-anchor="middle" class="axis">0</text>
<line x1="470.0" y1="230" x2="470.0" y2="640" stroke="#e2e8f0"/>
<text x="470.0" y="675" text-anchor="middle" class="axis">3,600</text>
<line x1="680.0" y1="230" x2="680.0" y2="640" stroke="#e2e8f0"/>
<text x="680.0" y="675" text-anchor="middle" class="axis">7,200</text>
<line x1="890.0" y1="230" x2="890.0" y2="640" stroke="#e2e8f0"/>
<text x="890.0" y="675" text-anchor="middle" class="axis">10,800</text>
<line x1="1100.0" y1="230" x2="1100.0" y2="640" stroke="#e2e8f0"/>
<text x="1100.0" y="675" text-anchor="middle" class="axis">14,400</text>
<line x1="1310.0" y1="230" x2="1310.0" y2="640" stroke="#e2e8f0"/>
<text x="1310.0" y="675" text-anchor="middle" class="axis">18,000</text>
<text x="236" y="305.3" text-anchor="end" class="label">Commercial</text>
<rect x="260" y="262.3" width="999.1" height="72" rx="4" fill="#0f766e"/>
<text x="1273.1" y="305.3" class="value">17,128</text>
<text x="236" y="442.0" text-anchor="end" class="label">Office</text>
<rect x="260" y="399.0" width="133.2" height="72" rx="4" fill="#2563eb"/>
<text x="407.2" y="442.0" class="value">2,284</text>
<text x="236" y="578.7" text-anchor="end" class="label">Hotel</text>
<rect x="260" y="535.7" width="20.6" height="72" rx="4" fill="#d97706"/>
<text x="294.6" y="578.7" class="value">353</text>
<text x="785.0" y="720" text-anchor="middle" class="axis">Estimated arrival trips per day</text>
<text x="700.0" y="768" text-anchor="middle" class="subtitle">Method: facility-specific person-trip-end rates; arrivals ≈ person-trip ends ÷ 2. Results are not unique visitor counts.</text>
</svg>
